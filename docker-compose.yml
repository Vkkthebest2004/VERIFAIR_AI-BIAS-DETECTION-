version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifair_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      # Mount the DB file relative to the project root into /app inside container
      - ./verifair.db:/app/verifair.db
    environment:
      # Use SQLite file mounted from host
      - DATABASE_URL=sqlite:////app/verifair.db
      - SECRET_KEY=hackathon_secret_key_change_me
      # Connect to host's Ollama instance (mac/windows)
      - LLM_HOST=http://host.docker.internal:11434
      # For Linux users, use the host IP explicitly if host.docker.internal doesn't work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verifair_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Internal Docker network URL for server-side rendering
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    command: npm run dev
