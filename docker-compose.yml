version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifair_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://verifair:verifair_secret@db:5432/verifair_db
      - SECRET_KEY=super_secret_jwt_key_change_me_in_prod
    depends_on:
      - redis
      - db
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verifair_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    command: npm run dev

  redis:
    image: redis:alpine
    container_name: verifair_redis
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    container_name: verifair_db
    environment:
      - POSTGRES_USER=verifair
      - POSTGRES_PASSWORD=verifair_secret
      - POSTGRES_DB=verifair_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
