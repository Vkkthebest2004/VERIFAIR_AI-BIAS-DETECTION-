version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifair_backend
    environment:
      - DATABASE_URL=sqlite:////data/verifair.db
      - SECRET_KEY=hackathon_secret_key_change_me
      # Connect to host machine's Ollama instance
      - LLM_HOST=http://host.docker.internal:11434
    volumes:
      # Mount source code for hot reloading
      - ./backend:/app/backend
      # Persist the database in a named volume
      - verifair_data:/data
    ports:
      - "8000:8000"
    extra_hosts:
      # Allow container to reach host (for Ollama)
      - "host.docker.internal:host-gateway"
    # Wait for DB volume to be ready, then start
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verifair_frontend
    environment:
      # Client-side API URL (Browser -> Backend)
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      # Mount source code for hot reloading
      - ./frontend:/app
      # Prevent host node_modules from overwriting container's
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  verifair_data:
